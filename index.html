<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web CLI Sandbox</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
  <style>
    body { background: #1e1e1e; color: #fff; font-family: sans-serif; margin: 0; padding: 10px; }
    #toolbar { margin-bottom: 10px; display: flex; gap: 10px; flex-wrap: wrap; }
    select, button { padding: 10px; background: #333; color: white; border: 1px solid #555; border-radius: 4px;}
    #terminal { height: 75vh; width: 100%; background: #000; padding: 10px; box-sizing: border-box; }
  </style>
</head>
<body>
  <div id="toolbar">
    <select id="cli-selector">
      <option value="cowsay hello from android!">Cowsay (Test)</option>
      <option value="@anthropic-ai/claude-code">Claude Code</option>
    </select>
    <button id="run-btn">Run Tool</button>
  </div>
  <div id="terminal"></div>
  
  <!-- This map lets us use npm packages without Node.js -->
  <script type="importmap">
    {
      "imports": {
        "@webcontainer/api": "https://esm.sh/@webcontainer/api",
        "xterm": "https://esm.sh/xterm@5.3.0",
        "xterm-addon-fit": "https://esm.sh/xterm-addon-fit@0.8.0"
      }
    }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
